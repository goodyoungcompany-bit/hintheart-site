<style>
  /* Schriften liegen auf dem eigenen Server (keine Verbindung zu Google, DSGVO-freundlich). Lizenz: SIL Open Font License, siehe hh-assets/fonts/ */
  @font-face { font-family: 'Baloo 2'; font-weight: 600; font-style: normal; font-display: swap; src: url("hh-assets/fonts/baloo-2-latin-600-normal.woff2") format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 700; font-style: normal; font-display: swap; src: url("hh-assets/fonts/baloo-2-latin-700-normal.woff2") format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; font-style: normal; font-display: swap; src: url("hh-assets/fonts/baloo-2-latin-800-normal.woff2") format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 400; font-style: normal; font-display: swap; src: url("hh-assets/fonts/nunito-latin-400-normal.woff2") format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 600; font-style: normal; font-display: swap; src: url("hh-assets/fonts/nunito-latin-600-normal.woff2") format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; font-style: normal; font-display: swap; src: url("hh-assets/fonts/nunito-latin-700-normal.woff2") format('woff2'); }

  :root { --navy: #1F2F6D; --yellow: #FAEC7F; --sun: #FFF4A8; --coral: #D61E32; --cream: #FFFBF2; --mint: #D7F0E3; --pink: #FFE3E6; --ink: #2B2B33; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--cream); color: var(--ink); -webkit-text-size-adjust: 100%;
         font: 400 16px/1.5 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  h1, h2, h3 { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; color: var(--navy); margin: 0; font-weight: 800; line-height: 1.12; }
  p { margin: 0; }
  a { color: inherit; }
  img { max-width: 100%; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .skip { position: absolute; left: -999px; top: 8px; background: #fff; color: var(--navy); padding: 8px 14px; border-radius: 10px; z-index: 20; font-weight: 700; }
  .skip:focus { left: 8px; }
  a:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

  .top { padding: 18px 0 14px; text-align: center; }
  .top img { width: 150px; height: auto; display: inline-block; }
  .nav { margin-top: 4px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; display: flex; flex-wrap: wrap; justify-content: center; }
  .nav a { color: var(--navy); text-decoration: none; margin: 0 9px; opacity: .8; display: inline-block; padding: 2px 0; }
  .nav a:hover { opacity: 1; text-decoration: underline; }
  .nav a[aria-current="page"] { opacity: 1; border-bottom: 2px solid var(--coral); }

  /* Titelkarte wie die gelbe Hero-Karte der Startseite */
  .phero { border-radius: 32px; text-align: center; padding: 30px 20px 26px;
           background: #FAEC7F; background: -webkit-linear-gradient(top left, var(--sun) 0%, var(--yellow) 100%); background: linear-gradient(160deg, var(--sun) 0%, var(--yellow) 100%); }
  .phero h1 { font-size: clamp(25px, 7.4vw, 33px); letter-spacing: -.2px; hyphens: auto; overflow-wrap: anywhere; }   /* lange deutsche Woerter (Datenschutzerklaerung) brechen um */
  .stand { display: inline-block; background: rgba(255,255,255,.75); color: var(--navy); font-weight: 700; font-size: 13.5px; padding: 4px 12px; border-radius: 999px; margin-top: 12px; }

  /* Text in einer weissen Karte wie der 'About'-Block */
  .doc { overflow-wrap: anywhere; background: #fff; border-radius: 22px; padding: 26px 22px 12px; max-width: 760px; margin: 22px auto 0; box-shadow: 0 6px 18px rgba(31,47,109,.11); }
  .doc h2 { font-size: 21px; margin: 24px 0 6px; }
  .doc h2:first-child { margin-top: 0; }
  .doc p { margin: 0 0 12px; line-height: 1.6; }
  .doc a { color: var(--coral); font-weight: 700; }
  .doc code { background: var(--cream); padding: 1px 6px; border-radius: 6px; }
  .todo { background: #FFF1A8; border-radius: 4px; padding: 0 4px; font-weight: 700; }
  .note { border: 2px dashed var(--coral); border-radius: 16px; padding: 12px 16px; margin: 0 0 22px; font-size: 14.5px; background: var(--pink); }

  .foot { text-align: center; padding: 38px 0 44px; font-size: 14px; }
  .foot img { width: 96px; height: auto; opacity: .9; }
  .foot p { margin-top: 8px; opacity: .7; }
  .legal { margin-top: 10px; font-size: 13px; opacity: .6; }
  .legal a { margin: 0 8px; }
  @media (min-width: 620px) { .phero h1 { font-size: 40px; } .doc { padding: 32px 36px 16px; } }

  /* Kontaktformular */
  .cform .row { margin: 0 0 14px; }
  .cform label { display: block; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .cform input[type=text], .cform input[type=email], .cform textarea { width: 100%; font: inherit; color: var(--ink); background: var(--cream);
         border: 2px solid #C9CDE6; border-radius: 14px; padding: 11px 14px; }
  .cform textarea { resize: vertical; min-height: 150px; }
  .cform input:focus, .cform textarea:focus { outline: 3px solid var(--coral); outline-offset: 1px; border-color: var(--navy); }
  .cform .hp { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  .cform .check { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 16px; font-size: 15px; }
  .cform .check input { margin-top: 4px; width: 20px; height: 20px; flex: none; accent-color: var(--navy); }
  .cform .check label { display: inline; font-weight: 600; color: var(--ink); margin: 0; }
  .btn { font: 800 17px 'Baloo 2', sans-serif; background: var(--navy); color: var(--yellow); border: 0; border-radius: 16px; padding: 12px 26px; cursor: pointer;
         box-shadow: 0 6px 14px rgba(31,47,109,.25); }
  .btn:disabled { opacity: .6; cursor: default; }
  .cstat { margin-top: 12px; padding: 0; font-weight: 700; }
  .cstat.ok, .cstat.err { padding: 12px 16px; border-radius: 14px; }
  .cstat.ok { background: var(--mint); color: var(--navy); } .cstat.err { background: var(--pink); color: #8A1220; }

  /* ---------- Sprachumschalter ---------- */
  .langs { margin-top: 2px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13.5px; }
  .langs a, .langs span { margin: 0 7px; color: var(--navy); text-decoration: none; display: inline-block; padding: 1px 0; }
  .langs a { opacity: .7; } .langs a:hover { opacity: 1; text-decoration: underline; }
  .langs .cur { border-bottom: 2px solid var(--coral); }
  .legal { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 4px; }   /* lange Links (DE/ES) duerfen in die naechste Zeile umbrechen */
</style>
</head>
<body>
<a class="skip" href="#doc">Skip to content</a>
<div class="wrap">

  <header class="top">
    <a href="./" aria-label="Hint Heart – home">
      <picture>
        <source type="image/webp" srcset="hh-assets/hintheart_wordmark.webp">
        <img src="hh-assets/hintheart_wordmark.png" width="600" height="131" alt="Hint Heart">
      </picture>
    </a>
    <nav class="nav" aria-label="Main"><a href="./">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="imprint.html">Imprint</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <p class="langs" aria-label="Language / Sprache / Idioma"><span class="cur" lang="en">English</span><a href="de/kontakt.html" hreflang="de" lang="de">Deutsch</a><a href="es/contacto.html" hreflang="es" lang="es">Español</a></p>
  </header>

  <main>
  <section class="phero" aria-labelledby="h-page">
    <h1 id="h-page">Contact</h1>
    
  </section>

  <article class="doc" id="doc">
    <p>Questions, ideas or a note about one of our books? Write to us here. We will answer by email.</p>
    <form id="cf" class="cform" novalidate>
      <p class="row"><label for="cf-name">Name (optional)</label><input id="cf-name" name="name" type="text" maxlength="100" autocomplete="name"></p>
      <p class="row"><label for="cf-email">Email address *</label><input id="cf-email" name="email" type="email" required maxlength="200" autocomplete="email"></p>
      <p class="row"><label for="cf-msg">Message *</label><textarea id="cf-msg" name="message" required minlength="10" maxlength="4000" rows="7"></textarea></p>
      <p class="hp" aria-hidden="true"><label>Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label></p>
      <p class="check"><input id="cf-consent" name="consent" type="checkbox" required><label for="cf-consent">I agree that my details are used to answer my message. More in the <a href="privacy.html">Privacy Policy</a>.</label></p>
      <p><button class="btn" id="cf-send" type="submit">Send message</button></p>
      <p id="cf-status" class="cstat" role="status" aria-live="polite"></p>
    </form>
    <noscript><p class="note">The contact form needs JavaScript. You can also write to us at hintheart8@gmail.com.</p></noscript>

  </article>
  </main>

  <footer class="foot">
    <picture>
      <source type="image/webp" srcset="hh-assets/hintheart_wordmark.webp">
      <img src="hh-assets/hintheart_wordmark.png" width="600" height="131" alt="Hint Heart" loading="lazy">
    </picture>
    <p>Made with 💛 for curious little hands.</p>
    <p class="legal"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a><a href="imprint.html">Imprint</a><a href="contact.html">Contact</a></p>
    <p class="legal">© 2026 Hint Heart</p>
  </footer>

</div>
<script>
(function () {
  var API = "https://go.hintheart.com/api/contact", LANG = "en", M = {"sending": "Sending …", "ok": "Thank you! Your message has been sent. We will answer by email.", "email": "Please enter a valid email address.", "message": "Please write a message (10 to 4000 characters).", "consent": "Please tick the box to agree.", "rate": "Too many messages from your network. Please try again later.", "too_fast": "That was very quick. Please wait a moment and try again, or reload the page.", "spam": "Your message looks like spam (too many links). Please remove links and try again.", "server": "Sorry, that did not work. Please try again later or write to hintheart8@gmail.com."};
  var f = document.getElementById("cf"), st = document.getElementById("cf-status"), btn = document.getElementById("cf-send"), t0 = Date.now();
  function say(msg, ok) { st.textContent = msg; st.className = "cstat " + (ok ? "ok" : "err"); }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = { name: f.name.value.trim(), email: f.email.value.trim(), message: f.message.value.trim(), consent: f.consent.checked,
              website: f.website.value, lang: LANG, t: t0 };
    if (!/^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]{2,}$/.test(d.email)) { say(M.email, false); f.email.focus(); return; }
    if (d.message.length < 10 || d.message.length > 4000) { say(M.message, false); f.message.focus(); return; }
    if (!d.consent) { say(M.consent, false); f.consent.focus(); return; }
    btn.disabled = true; say(M.sending, true);
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }, function () { return { s: r.status, j: {} }; }); })
      .then(function (x) {
        if (x.j && x.j.ok) { say(M.ok, true); f.reset(); return; }
        say(M[(x.j && x.j.error) || "server"] || M.server, false); btn.disabled = false;
      })
      .catch(function () { say(M.server, false); btn.disabled = false; });
  });
})();
</script>
</body>
